{% extends "base.html" %}

{% block title %}Cadastro — Mesanerd Web{% endblock %}

{% block content %}
<div class="page-login">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🎲</div>
            <h1 class="login-title">CRIAR CONTA</h1>
            <p class="login-subtitle">Junte-se à aventura em Cidadela Sem Sol</p>
        </div>
        
        <form action="/auth/register" method="post" class="login-form" novalidate>
            <div class="form-group">
                <label for="display_name" class="form-label">
                    <i class="fa-solid fa-user"></i> Nome de exibição
                </label>
                <input 
                    type="text" 
                    id="display_name" 
                    name="display_name" 
                    class="form-input" 
                    placeholder="Seu nome de aventureiro"
                    required
                    minlength="2"
                    maxlength="50"
                    autocomplete="name"
                    autofocus
                >
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fa-solid fa-envelope"></i> Email
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="seu@email.com"
                    required
                    autocomplete="email"
                >
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i> Senha
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Mínimo 6 caracteres"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>
            
            <div class="form-group">
                <label for="password_confirm" class="form-label">
                    <i class="fa-solid fa-lock"></i> Confirmar senha
                </label>
                <input 
                    type="password" 
                    id="password_confirm" 
                    name="password_confirm" 
                    class="form-input" 
                    placeholder="Repita a senha"
                    required
                    autocomplete="new-password"
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-dice-d20"></i> Criar Personagem
            </button>
        </form>
        
        {% include 'partials/google_login_button.html' %}
        
        <div class="login-footer">
            <p>Já tem conta? <a href="/auth/login">Entre agora</a></p>
        </div>
    </div>
    
    <div class="login-bg-decoration">
        <div class="bg-die bg-die-1"></div>
        <div class="bg-die bg-die-2"></div>
        <div class="bg-die bg-die-3"></div>
    </div>
</div>
{% endblock %}
